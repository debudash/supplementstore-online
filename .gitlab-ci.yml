# GitLab CI pipeline. This is the pipeline that actually executes on the GitLab
# remote (labs.gauntletai.com). It is job-for-job equivalent to the GitHub Actions
# workflow in .github/workflows/ci.yml, which is retained per ARCHITECTURE section 2
# / ADR-020 but does not run on a GitLab remote.

default:
  image: node:20

stages:
  - guardrails
  - test
  - deploy

# Run on merge requests and on branch pushes (so a pipeline is visible immediately
# after pushing, before an MR exists). `web` and `api` are also admitted so a deploy
# can be re-fired on demand without manufacturing a commit: `web` is the GitLab UI
# "Run pipeline" button, `api` is POST /projects/:id/pipeline. Both were previously
# excluded, which is why a manual/api pipeline on main was refused. This only lets the
# pipeline START; the deploy-railway job's own rules still gate it to main AND
# $RAILWAY_TOKEN, so a web/api run on a feature branch runs guardrails + build-test only.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

variables:
  # Postgres service (see api-tests job). Host is the service alias.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cerbo
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/cerbo"
  NODE_ENV: test
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# AI-01: no float money (AGENTS.md money rule 1). Fail if a float-formatting CALL
# appears in money-sensitive code. We match call syntax, not bare tokens, so a comment
# or string merely naming "toFixed"/"parseFloat" no longer trips the guard (that false
# positive once skipped build-test repo-wide). Matched calls:
#   x.toFixed(          .toFixed\s*\(
#   parseFloat(         \bparseFloat\s*\(   (also covers Number.parseFloat's trailing call)
#   Number.parseFloat(  \bNumber\.parseFloat\s*\(   (explicit, so the form is never missed)
# Math.round is intentionally NOT grepped: rule 1 forbids it on dollar values, but a
# regex cannot tell a dollar argument from legitimate integer/non-money rounding (e.g.
# days, percentages, chart values in reports), and with only_allow_merge_if_pipeline_succeeds
# a false positive would hard-block every merge. Math.round-on-money is caught instead by
# packages/money's property tests and code review (all money math must route through
# packages/money). Searched scope is unchanged: money, ledger, payments, refunds, reports.
ai01-floats:
  stage: guardrails
  script:
    - |
      set -e
      PATTERN='\.toFixed\s*\(|\bparseFloat\s*\(|\bNumber\.parseFloat\s*\('
      TARGETS="packages/money apps/api/src/ledger apps/api/src/payments apps/api/src/refunds apps/api/src/reports apps/api/src/orders"
      FOUND=0
      for d in $TARGETS; do
        if [ -d "$d" ]; then
          if grep -rnE "$PATTERN" "$d"; then
            echo "AI-01 violation: float money math in $d"
            FOUND=1
          fi
        fi
      done
      if [ "$FOUND" = "1" ]; then exit 1; fi
      echo "AI-01 check passed"

# AI-03: protected paths must not change without an explicit human-approval label.
ai03-protected:
  stage: guardrails
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -e
      PROTECTED='packages/money/test apps/api/test/invariants tests/e2e/golden AGENTS.md CLAUDE.md docs/SPEC.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/METRICS.md docs/EVALS.md'
      # Prefer the MR diff base; otherwise diff against origin/main.
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE" ]; then
        git fetch origin main --depth=50 || true
        BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
      fi
      if [ -z "$BASE" ]; then
        echo "No base ref to diff against; skipping protected-path check."
        exit 0
      fi
      CHANGED=$(git diff --name-only "$BASE" HEAD)
      HITS=""
      for p in $PROTECTED; do
        MATCH=$(echo "$CHANGED" | grep -E "^$p" || true)
        if [ -n "$MATCH" ]; then HITS="$HITS\n$MATCH"; fi
      done
      if [ -n "$HITS" ]; then
        echo -e "Protected paths changed:$HITS"
        case ",${CI_MERGE_REQUEST_LABELS}," in
          *",approved-protected-change,"*)
            echo "Human approval label present; allowing." ;;
          *)
            echo "AI-03 violation: protected path changed without 'approved-protected-change' label"
            exit 1 ;;
        esac
      else
        echo "AI-03 check passed: no protected paths changed"
      fi

# Lint, typecheck, build, unit + api tests across ALL workspaces (incl. packages/money
# once it lands). API tests run against a Postgres 16 service container.
#
# `needs: []` decouples this job from stage ordering so it ALWAYS runs and reports,
# even when a guardrail job fails. Without it, a failed `guardrails` stage skips the
# whole `test` stage, which meant the owner lost all test evidence on exactly the
# gated MRs that legitimately touch protected paths (T2 G2, T4 G3, T13 goldens).
# Enforcement is unchanged: ai01-floats and ai03-protected still run and a failure in
# either still fails the pipeline overall - this only stops build-test being skipped.
build-test:
  stage: test
  needs: []
  services:
    - name: postgres:16
      alias: postgres
  script:
    # Strict, reproducible install. NO `|| npm install` fallback: the fallback
    # silently masked root lockfile drift, so every "green" pipeline was really
    # green on npm install, never on npm ci. A green build-test here now proves the
    # committed package-lock.json is actually in sync (and the Railway Dockerfile,
    # which uses strict `npm ci`, will build).
    - npm ci --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm run build
    - npm test

# Deploy to Railway on merge to main (docs/DEPLOY.md, Path A). Railway's native Git
# integration is GitHub-only and cannot source from this self-hosted GitLab remote, so
# we deploy from CI: the Railway CLI uploads the repo and Railway builds the Dockerfile.
#
# GUARD (read before editing): this job is created ONLY when the branch is `main` AND a
# `RAILWAY_TOKEN` CI/CD variable exists. Until the owner adds that masked, protected
# variable the job does not run at all, so main stays green; deploy then begins
# automatically on the first main pipeline after the variable is added. The job lives in
# its own `deploy` stage AFTER `test` and deliberately has NO `needs`, so it waits for
# the guardrails and test stages - a red guardrail or a red build-test blocks the deploy.
# It never runs on merge requests or non-main branches. Uses the project-scoped
# RAILWAY_TOKEN only (no account token, so no `railway init` / `railway add`); the owner
# must create the project and Postgres first. The token is read from the environment by
# the CLI and is never printed.
deploy-railway:
  stage: deploy
  resource_group: production   # serialize deploys so two never run at once
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $RAILWAY_TOKEN'
      when: on_success
    - when: never
  script:
    # RAILWAY_TOKEN (project-scoped) is read automatically from the environment.
    # RAILWAY_SERVICE is the app service NAME; required because the project has more
    # than one service (Postgres + the app) so `railway up` knows which to deploy to.
    - npm i -g @railway/cli
    # `railway up` returns once the deployment is QUEUED, not when the app is actually
    # running. Verified at runtime: it exits a few seconds after upload, before the
    # build/boot/healthcheck - even with CI unset. So `railway up` alone is NOT a gate;
    # on its own it produced a false green while the app crash-looped (@cerbo/money
    # MODULE_NOT_FOUND). The real gate is the health poll below.
    - railway up ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"}
    # GATE: poll the live health URL until it returns HTTP 200; fail the job if it never
    # does, so a crashed or unhealthy deploy reds the pipeline. Fail LOUDLY (not skip) if
    # the URL is unset - a silently skipped gate is how the earlier false green happened.
    # Budget ~5 min (30 x 10s): `railway up` returns at queue time, so this must outlast
    # the full remote Docker build (~2-3 min observed) plus container boot and edge/DNS
    # propagation, with margin, without hanging the runner indefinitely.
    - |
      if [ -z "$RAILWAY_HEALTHCHECK_URL" ]; then
        echo "RAILWAY_HEALTHCHECK_URL is not set - cannot verify the deploy is healthy."
        echo "Failing loudly rather than skipping the post-deploy health gate."
        exit 1
      fi
      echo "Polling $RAILWAY_HEALTHCHECK_URL for HTTP 200 (up to 30 attempts, 10s apart)..."
      last="000"
      for i in $(seq 1 30); do
        last="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$RAILWAY_HEALTHCHECK_URL")" || true
        echo "attempt $i/30: HTTP $last"
        if [ "$last" = "200" ]; then
          echo "Deploy healthy: $RAILWAY_HEALTHCHECK_URL returned 200."
          exit 0
        fi
        sleep 10
      done
      echo "DEPLOY HEALTHCHECK FAILED: $RAILWAY_HEALTHCHECK_URL never returned 200 (last status: $last) after ~5 min."
      exit 1
