# GitLab CI pipeline. This is the pipeline that actually executes on the GitLab
# remote (labs.gauntletai.com). It is job-for-job equivalent to the GitHub Actions
# workflow in .github/workflows/ci.yml, which is retained per ARCHITECTURE section 2
# / ADR-020 but does not run on a GitLab remote.

default:
  image: node:20

stages:
  - guardrails
  - test

# Run on merge requests and on branch pushes (so a pipeline is visible immediately
# after pushing, before an MR exists).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

variables:
  # Postgres service (see api-tests job). Host is the service alias.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cerbo
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/cerbo"
  NODE_ENV: test
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# AI-01: no float money. Fail if toFixed / parseFloat appear in money-sensitive code.
ai01-floats:
  stage: guardrails
  script:
    - |
      set -e
      PATTERN='toFixed|parseFloat'
      TARGETS="packages/money apps/api/src/ledger apps/api/src/payments apps/api/src/refunds apps/api/src/reports apps/api/src/orders"
      FOUND=0
      for d in $TARGETS; do
        if [ -d "$d" ]; then
          if grep -rnE "$PATTERN" "$d"; then
            echo "AI-01 violation: float money math in $d"
            FOUND=1
          fi
        fi
      done
      if [ "$FOUND" = "1" ]; then exit 1; fi
      echo "AI-01 check passed"

# AI-03: protected paths must not change without an explicit human-approval label.
ai03-protected:
  stage: guardrails
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -e
      PROTECTED='packages/money/test apps/api/test/invariants tests/e2e/golden AGENTS.md CLAUDE.md docs/SPEC.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/METRICS.md docs/EVALS.md'
      # Prefer the MR diff base; otherwise diff against origin/main.
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE" ]; then
        git fetch origin main --depth=50 || true
        BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
      fi
      if [ -z "$BASE" ]; then
        echo "No base ref to diff against; skipping protected-path check."
        exit 0
      fi
      CHANGED=$(git diff --name-only "$BASE" HEAD)
      HITS=""
      for p in $PROTECTED; do
        MATCH=$(echo "$CHANGED" | grep -E "^$p" || true)
        if [ -n "$MATCH" ]; then HITS="$HITS\n$MATCH"; fi
      done
      if [ -n "$HITS" ]; then
        echo -e "Protected paths changed:$HITS"
        case ",${CI_MERGE_REQUEST_LABELS}," in
          *",approved-protected-change,"*)
            echo "Human approval label present; allowing." ;;
          *)
            echo "AI-03 violation: protected path changed without 'approved-protected-change' label"
            exit 1 ;;
        esac
      else
        echo "AI-03 check passed: no protected paths changed"
      fi

# Lint, typecheck, build, unit + api tests across ALL workspaces (incl. packages/money
# once it lands). API tests run against a Postgres 16 service container.
#
# `needs: []` decouples this job from stage ordering so it ALWAYS runs and reports,
# even when a guardrail job fails. Without it, a failed `guardrails` stage skips the
# whole `test` stage, which meant the owner lost all test evidence on exactly the
# gated MRs that legitimately touch protected paths (T2 G2, T4 G3, T13 goldens).
# Enforcement is unchanged: ai01-floats and ai03-protected still run and a failure in
# either still fails the pipeline overall - this only stops build-test being skipped.
build-test:
  stage: test
  needs: []
  services:
    - name: postgres:16
      alias: postgres
  script:
    - npm ci --prefer-offline || npm install
    - npm run lint
    - npm run typecheck
    - npm run build
    - npm test
